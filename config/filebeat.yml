# ============================== Filebeat Configuration ==============================
# Project Athena - Self-Hosted Honeypot SOC with ML Anomaly Detection
# Filebeat ships Cowrie honeypot JSON logs directly into Elasticsearch with sub-second latency.

filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/log/cowrie/log/cowrie/cowrie.json*
      - /var/log/cowrie/cowrie.json*
      - /var/log/cowrie/*.json*
    json.keys_under_root: true
    json.overwrite_keys: true
    json.add_error_key: true
    scan_frequency: 0.5s
    backoff: 0.2s
    max_backoff: 0.5s
    close_inactive: 24h

queue.mem:
  events: 512
  flush.min_events: 1
  flush.timeout: 0.2s

# -------------------------- Elasticsearch Template & ILM --------------------------
setup.template.enabled: false
setup.ilm.enabled: false

# ---------------------------- Elasticsearch Output ---------------------------------
output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "cowrie-logs-%{+yyyy.MM.dd}"

# -------------------------------- Logging & Debug ----------------------------------
logging.level: info
logging.to_files: false
